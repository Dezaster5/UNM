spring:
  application:
    name: university-management-system
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:unm}
    username: ${DB_USERNAME:unm_user}
    password: ${DB_PASSWORD:unm_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:default-development-secret-key-change-in-production-please}
    expiration: ${JWT_EXPIRATION:86400000}
  file-storage:
    upload-dir: ${UPLOAD_DIR:uploads}
    max-size-bytes: ${MAX_FILE_SIZE_BYTES:10485760}
    allowed-content-types:
      - application/pdf
      - image/png
      - image/jpeg
      - text/plain

logging:
  level:
    kz.unm.tusupkalimiraszhaugashnurzhan: INFO
    org.springframework.security: INFO

springdoc:
  swagger-ui:
    path: /swagger-ui/index.html
