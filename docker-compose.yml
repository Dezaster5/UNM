services:
  postgres:
    image: postgres:16-alpine
    container_name: unm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-unm}
      POSTGRES_USER: ${DB_USERNAME:-unm_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-unm_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-unm_user} -d ${DB_NAME:-unm}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - unm-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: unm-university-management-system:latest
    container_name: unm-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-unm}
      DB_USERNAME: ${DB_USERNAME:-unm_user}
      DB_PASSWORD: ${DB_PASSWORD:-unm_password}
      JWT_SECRET: ${JWT_SECRET:-compose-development-secret-key-for-university-management-system-please-change}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      UPLOAD_DIR: /app/uploads
      LOG_PATH: /app/logs
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75.0}
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - app_uploads:/app/uploads
      - app_logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - unm-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  app_uploads:
  app_logs:

networks:
  unm-network:
    driver: bridge
