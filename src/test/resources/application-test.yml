spring:
  datasource:
    url: jdbc:h2:mem:unm_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

app:
  jwt:
    secret: test-development-secret-key-with-at-least-256-bits-length
    expiration: 3600000
  file-storage:
    upload-dir: target/test-uploads
    max-size-bytes: 1048576
    allowed-content-types:
      - application/pdf
      - image/png
      - image/jpeg
      - text/plain
